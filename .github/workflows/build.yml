name: Build Windows  
  
on:  
  push:  
    branches: [ main ]  
    tags: [ 'v*' ]  
  pull_request:  
    branches: [ main ]  
  
jobs:  
  build:  
    runs-on: windows-latest  
  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
  
      - name: Install Qt  
        uses: jurplel/install-qt-action@v4  
        with:  
          version: '6.7.3'  
          host: windows  
          target: desktop  
          arch: win64_msvc2022_64  
  
      - name: Setup MSVC  
        uses: ilammy/msvc-dev-cmd@v1  
  
      - name: Configure CMake  
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"  
  
      - name: Build  
        run: cmake --build build --config Release  
  
      - name: Deploy Qt dependencies  
        run: |  
          New-Item -ItemType Directory -Force -Path dist  
          Copy-Item build/RP2040_Control.exe dist/  
          windeployqt --release --no-translations --compiler-runtime dist/RP2040_Control.exe  
  
      - name: Upload build artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: RP2040_Control  
          path: dist  
  
      - name: Create release zip  
        if: startsWith(github.ref, 'refs/tags/')  
        run: Compress-Archive -Path dist/* -DestinationPath RP2040_Control.zip  
  
      - name: Attach to GitHub Release  
        if: startsWith(github.ref, 'refs/tags/')  
        uses: softprops/action-gh-release@v2  
        with:  
          files: RP2040_Control.zip
