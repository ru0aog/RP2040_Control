name: Build Windows  
  
on:  
  push:  
    branches: [ main ]  
  pull_request:  
    branches: [ main ]  
  
jobs:  
  build:  
    runs-on: windows-latest  
  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
  
      - name: Install Qt  
        uses: jurplel/install-qt-action@v4  
        with:  
          version: '6.7.3'  
          host: windows  
          target: desktop  
          arch: win64_msvc2019_64  
  
      - name: Setup MSVC  
        uses: ilammy/msvc-dev-cmd@v1  
  
      - name: Configure CMake  
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"  
  
      - name: Build  
        run: cmake --build build --config Release  
  
      - name: Deploy Qt dependencies  
        run: |  
          New-Item -ItemType Directory -Force -Path dist  
          Copy-Item build/RP2040_Control.exe dist/  
          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler --skip-plugin-types networkinformation,tls,imageformats,iconengines --compiler-runtime dist/RP2040_Control.exe  
  
      - name: Upload build artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: RP2040_Control  
          path: dist
