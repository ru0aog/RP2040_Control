name: Build Windows  
  
on:  
  push:  
    branches: [ main ]  
  pull_request:  
    branches: [ main ]  
  
jobs:  
  build:  
    runs-on: windows-latest  
  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
  
      - name: Install Qt  
        uses: jurplel/install-qt-action@v4  
        with:  
          version: '6.7.3'  
          host: windows  
          target: desktop  
          arch: win64_msvc2019_64  
  
      - name: Setup MSVC  
        uses: ilammy/msvc-dev-cmd@v1  
  
      - name: Configure CMake  
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"  
  
      - name: Build  
        run: cmake --build build --config Release  
  
      - name: Deploy Qt dependencies  
        run: |  
          New-Item -ItemType Directory -Force -Path dist  
          Copy-Item build/RP2040_Control.exe dist/  
          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler --skip-plugin-types networkinformation,tls,imageformats,iconengines --compiler-runtime dist/RP2040_Control.exe  
  
      - name: Install Enigma Virtual Box  
        run: choco install enigmavirtualbox -y --ignore-checksums
  
      - name: Pack into single exe  
        shell: pwsh  
        run: |  
          $distDir = (Resolve-Path dist).Path  
          $mainExe = Join-Path $distDir "RP2040_Control.exe"  
          $outExe  = Join-Path $distDir "RP2040_Control_portable.exe"  
  
          # Рекурсивно строим дерево <File>/<Folder> для EVB по содержимому dist,  
          # исключая сам основной exe (он идёт как InputFile).  
          function Build-Nodes([string]$path) {  
              $sb = ""  
              foreach ($item in Get-ChildItem -LiteralPath $path) {  
                  if ($item.PSIsContainer) {  
                      $sb += "<File><Type>3</Type><Name>$($item.Name)</Name><Files>"  
                      $sb += Build-Nodes $item.FullName  
                      $sb += "</Files></File>"  
                  } elseif ($item.FullName -ne $mainExe) {  
                      $sb += "<File><Type>2</Type><Name>$($item.Name)</Name><File>$($item.FullName)</File>" +  
                             "<ActiveX>false</ActiveX><ActiveXInstall>false</ActiveXInstall>" +  
                             "<Action>0</Action><OverwriteDateTime>false</OverwriteDateTime>" +  
                             "<OverwriteAttributes>false</OverwriteAttributes><PassCommandLine>false</PassCommandLine></File>"  
                  }  
              }  
              return $sb  
          }  
  
          $filesXml = Build-Nodes $distDir  
  
          $evb = @"  
          <?xml version="1.0" encoding="windows-1251"?>  
          <>  
            <InputFile>$mainExe</InputFile>  
            <OutputFile>$outExe</OutputFile>  
            <Files>  
              <Enabled>true</Enabled>  
              <DeleteExtractedOnExit>true</DeleteExtractedOnExit>  
              <CompressFiles>true</CompressFiles>  
              <Files>  
                <File><Type>3</Type><Name>%DEFAULT FOLDER%</Name><Files>$filesXml</Files></File>  
              </Files>  
            </Files>  
            <Registries><Enabled>false</Enabled></Registries>  
            <Packaging><Enabled>false</Enabled></Packaging>  
            <Options><ShareVirtualSystem>false</ShareVirtualSystem><MapExecutableWithTemporaryFile>true</MapExecutableWithTemporaryFile><AllowRunningOfVirtualExeFile>true</AllowRunningOfVirtualExeFile></Options>  
          </>  
          "@  
          Set-Content -Path project.evb -Value $evb -Encoding UTF8  
  
          & "C:\Program Files (x86)\Enigma Virtual Box\enigmavbconsole.exe" project.evb  
  
      - name: Upload build artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: RP2040_Control  
          path: dist/RP2040_Control_portable.exe
