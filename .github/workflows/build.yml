name: Build Windows  
  
on:  
  push:  
    branches: [ main ]  
  pull_request:  
    branches: [ main ]  
  
jobs:  
  build:  
    runs-on: windows-latest  
  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
  
      - name: Setup MSYS2  
        uses: msys2/setup-msys2@v2  
        with:  
          msystem: MINGW64  
          update: true  
          install: >-  
            mingw-w64-x86_64-qt6-static  
            mingw-w64-x86_64-cmake  
            mingw-w64-x86_64-ninja  
            mingw-w64-x86_64-gcc  
  
      - name: Configure CMake  
        shell: msys2 {0}  
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/mingw64/qt6-static  
  
      - name: Build  
        shell: msys2 {0}  
        run: cmake --build build  
  
      - name: Upload build artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: RP2040_Control  
          path: build/RP2040_Control.exe
